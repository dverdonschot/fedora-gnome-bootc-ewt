name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: quay.io/buildah/stable:latest
      options: --privileged
    env:
      FEDORA_VERSION: ${{ vars.FEDORA_VERSION || '44' }}
      REGISTRY: ${{ vars.REGISTRY || 'ghcr.io' }}
      REGISTRY_NAMESPACE: ${{ vars.REGISTRY_NAMESPACE || 'dverdonschot' }}
      IMAGE: ${{ vars.IMAGE || 'fedora-gnome-bootc-ewt' }}
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: show tool versions
        run: |
          buildah --version
          podman --version || true

      # Build + push are split so a failed build doesn't churn the registry
      # with stale tags. buildah's default vfs storage driver is fine under
      # --privileged; the image is exported to OCI anyway.

      - name: build
        run: |
          chmod +x build/build.sh
          ./build/build.sh

      # Push runs on push/tag only. build.sh handles `podman login` from
      # REGISTRY_USER + REGISTRY_TOKEN env so we don't duplicate the logic.
      - name: push
        if: github.event_name == 'push'
        env:
          REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: ./build/build.sh --push
